<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amber</title>
    <style>
      /* A drawn cursor: headless Chrome doesn't paint the real one. */
      #demo-cursor { position: fixed; z-index: 99999; left: -50px; top: -50px; width: 22px; height: 22px; pointer-events: none;
        filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35)); transition: transform 0.12s; }
      #demo-cursor.down { transform: scale(0.82); }
      .demo-ripple { position: fixed; z-index: 99998; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
        pointer-events: none; background: rgb(201 106 11 / 0.35); animation: demo-ripple 0.45s ease-out forwards; }
      @keyframes demo-ripple { from { transform: scale(0.3); opacity: 1 } to { transform: scale(1.6); opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <svg id="demo-cursor" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.5 13.8 L10.6 20.4 L13.4 19.1 L10.4 12.6 L16.4 12.6 Z" fill="#1f1b16" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <script>
      const c = document.getElementById("demo-cursor");
      addEventListener("mousemove", (e) => { c.style.left = e.clientX - 3 + "px"; c.style.top = e.clientY - 2 + "px"; }, true);
      addEventListener("mousedown", (e) => {
        c.classList.add("down");
        const r = Object.assign(document.createElement("div"), { className: "demo-ripple" });
        r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px";
        document.body.append(r); setTimeout(() => r.remove(), 500);
      }, true);
      addEventListener("mouseup", () => c.classList.remove("down"), true);
    </script>
    <script type="module" src="/demo/mock.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
