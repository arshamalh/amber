name: CI

# Checks only. Installers are built by release.yml when a v* tag is pushed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          # A dead mirror once hung apt for 6 hours: time out and retry instead.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Fetch Tinymist sidecar
        run: npm run fetch-tinymist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check UI
        run: npm run check
      - name: Build UI
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
