name: Release

# Push a tag like `v0.0.1` to build installers for every platform. They are
# collected in a draft GitHub release, which is published automatically once
# every platform has built. If any build fails, it stays a draft.
# The tag must match "version" in src-tauri/tauri.conf.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          # A dead mirror once hung apt for 6 hours: time out and retry instead.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # Filled on `main` by warm-cache.yml: a tag can't read another tag's
      # cache, so saving one here would only cost time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Update-signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY. See docs/RELEASING.md."
            exit 1
          fi

      - name: Release notes
        id: notes
        shell: bash
        run: |
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$file" ]; then
            echo "::error::Missing $file. See docs/RELEASING.md."
            exit 1
          fi
          {
            echo "body<<AMBER_NOTES_EOF"
            cat "$file"
            echo
            cat docs/releases/_footer.md
            echo "AMBER_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Fetch Tinymist sidecar
        run: node scripts/fetch-tinymist.mjs ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies of Amber accept them
          # (free; unrelated to Apple or Windows code signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Amber ${{ github.ref_name }}
          # docs/releases/<tag>.md + the install footer; also shown by the updater.
          releaseBody: ${{ steps.notes.outputs.body }}
          # A draft while the platforms build; the publish job below makes it
          # public (and reachable through latest.json) when all have succeeded.
          releaseDraft: true
          prerelease: false
          # latest.json is written once by the publish job; parallel jobs
          # updating it raced (one deleted it while another read it).
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

  publish:
    name: Publish release
    needs: release # waits for every platform; skipped if any failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the updater feed (latest.json)
        run: |
          node scripts/updater-json.mjs "${{ github.ref_name }}" latest.json
          gh release upload "${{ github.ref_name }}" latest.json --clobber

      - name: Publish the draft as the latest release
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
